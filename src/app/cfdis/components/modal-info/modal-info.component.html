<dialog #myModalInfoCFDI class="modal">
  <div class="modal-box w-11/12 max-w-5xl">
    <!-- Muestra spinner de carga si la petición está activa -->
    @if (infoById.isLoading()) {
      <div class="flex justify-center p-4">
        <span class="loading loading-spinner loading-lg"></span>
      </div>
    }

    <!--  -->
    @else if((infoById.value() === null || infoById.value() === undefined )){
      <div role="alert" class="alert alert-error alert-soft">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ infoById.error() }}</span>
      </div>
    }

    <!-- Muestra el contenido cuando los datos llegan -->
    @else if(infoById.value(); as cfdiInfo){
      <info-by-modal-component
        [items] = "cfdiInfo"
      />
    }

    <div class="modal-action">
      <form method="dialog">
        <button class="btn">Cerrar</button>
      </form>
    </div>
  </div>
</dialog>
