<div class="card bg-base-100 shadow-lg border border-base-200">
  <div class="card-body p-3 sm:p-6 gap-4">

    <!-- Encabezado -->
    <div class="flex items-center justify-between">
      <h2 class="text-lg sm:text-xl font-bold">Listado de Comprobantes</h2>
    </div>

    <!-- Barra de filtros -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-3 p-3 rounded-box bg-base-200/50">
      <span class="text-sm font-medium text-base-content/70 whitespace-nowrap">
        Ordenar por:
      </span>

      <div class="join">
        <label class="join-item btn btn-sm has-checked:btn-secondary">
          <input type="radio"
                class="hidden"
                name="orderByImp"
                value="1"
                (change)="orderByFecha($event)"
                [checked]="checked() === 1" />
          Fecha de importación
        </label>
        <label class="join-item btn btn-sm has-checked:btn-secondary">
          <input type="radio"
                class="hidden"
                name="orderByImp"
                value="2"
                (change)="orderByFecha($event)"
                [checked]="checked() === 2" />
          Fecha del comprobante
        </label>
      </div>

      <div class="sm:ml-auto">
        <button class="btn btn-sm btn-ghost gap-2" title="Eliminar filtro"
                (click)="cleanFill($event)">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.1em" height="1.1em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M21 3H5a1 1 0 0 0-1 1v2.59c0 .523.213 1.037.583 1.407L10 13.414V21a1 1 0 0 0 1.447.895l4-2c.339-.17.553-.516.553-.895v-5.586l5.417-5.417c.37-.37.583-.884.583-1.407V4a1 1 0 0 0-1-1m-6.707 9.293A1 1 0 0 0 14 13v5.382l-2 1V13a1 1 0 0 0-.293-.707L6 6.59V5h14.001l.002 1.583z" />
          </svg>
          Limpiar filtro
        </button>
      </div>
    </div>

    @if (lists().length > 0) {
      <list-dtl [dtl_list] = "lists()"/>

      <div class="flex justify-center sm:justify-end">
        <pagination-component
          [rows]="rows()"
          [pages]="pages()"
          [act_page]="page_act()"
          (pageChange)="pageChange.emit($event)"
        />
      </div>
    } @else {
      <div class="flex flex-col items-center justify-center py-12 text-base-content/60">
        <h2 class="text-lg font-semibold">No se encontraron comprobantes</h2>
        <p class="text-sm">Prueba cambiando o limpiando el filtro.</p>
      </div>
    }

  </div>
</div>
