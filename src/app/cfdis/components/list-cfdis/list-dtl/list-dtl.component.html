<!-- Tabla -->
      <div class="overflow-x-auto w-full rounded-box border border-base-200">
        <table class="table table-zebra table-sm sm:table-md w-full">
          <thead class="bg-base-200 text-xs uppercase tracking-wide">
            <tr class="hover:bg-base-300/50">
              <th>#</th>
              <th>Fecha</th>
              <th>Serie</th>
              <th>Folio Fiscal</th>
              <th>RFC Emisor</th>
              <th>Nombre Emisor</th>
              <th class="text-center">Método Pago</th>
              <th class="text-center">Tipo</th>
              <th class="text-center">Total</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>

                <td class="font-mono text-xs">{{ dtl.rfc_e }}</td>
                <td class="max-w-[16rem] truncate" [title]="dtl.nom_e">{{ dtl.nom_e }}</td>
                <td class="text-center">
                  <span class="badge badge-ghost badge-sm">{{ dtl.met_p }}</span>
                </td>
                <td class="text-center">
                  <span class="badge badge-outline badge-sm">{{ dtl.tip_c }}</span>
