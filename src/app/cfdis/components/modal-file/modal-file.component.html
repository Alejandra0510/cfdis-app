<dialog #myModalFile class="modal">
  <div class="modal-box">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
    </form>
    <h3 class="text-lg font-bold">Importar Comprobante</h3>
    <br>
    <form #formFile>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Seleccione un archivo</legend>
        <input type="file"
              class="file-input w-full"
              accept="text/xml" />
        <label class="label text-error">Archivos tipo XML</label>
      </fieldset>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn btn-xs sm:btn-sm md:btn-md lg:btn-md xl:btn-md mr-2">Salir</button>
          <button type="submit"
            class="btn btn-success btn-xs sm:btn-sm md:btn-md lg:btn-md xl:btn-md">Guardar</button>
        </form>
      </div>
    </form>
  </div>
</dialog>
